services:
  mysql:
    image: mysql:8.0
    container_name: scholr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: scholr
      MYSQL_DATABASE: scholr
    ports:
      - "3306:3306"
    volumes:
      - scholr_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pscholr"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  scholr_mysql:
